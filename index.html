<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>트임파닉스쿨 시험</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="트임시험">
<meta name="theme-color" content="#3C7D69">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --paper:#FBFBF8; --grid:#E2E1D6; --ink:#1B1B18; --ink-soft:#6E6D62;
    --pen:#27418F; --red:#B8332A; --hl:#FFF176; --hl-edge:#E8CE3A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
    font-size:15px;line-height:1.5;padding-bottom:60px;font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:580px;margin:0 auto;padding:0 14px}
  header{background:var(--paper);border-bottom:1px solid var(--grid);position:sticky;top:0;z-index:20}
  .datebar{display:flex;align-items:center;gap:8px;padding:10px 0}
  .datebar h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.02em;flex:1}
  .datebar h1 small{font-size:14px;font-weight:500;color:var(--ink-soft);margin-left:6px}
  .nav{width:34px;height:34px;border:1px solid var(--grid);background:#fff;border-radius:50%;font-size:16px;color:var(--ink);cursor:pointer;line-height:1}
  .nav:active{background:var(--grid)}
  .quick{display:flex;gap:6px;padding-bottom:10px;flex-wrap:wrap;align-items:center}
  .chip{border:1px solid var(--grid);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs{display:flex;border-top:1px solid var(--grid)}
  .tab{flex:1;padding:11px 0;text-align:center;font-size:14px;white-space:nowrap;letter-spacing:-.3px;font-weight:600;color:var(--ink-soft);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;font-family:inherit}
  @media (max-width:420px){ .tab{font-size:12.5px} .quick .chip{padding:5px 10px} #dpick{width:128px;padding:4px 6px!important} }
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}

  .total{display:flex;align-items:baseline;gap:10px;margin:16px 0 4px}
  .total b{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .total span{font-size:13px;color:var(--ink-soft)}
  .rule{border-left:3px solid var(--hl-edge);background:#FEFBE3;padding:7px 10px;font-size:13px;margin:8px 0;border-radius:0 3px 3px 0}

  .sec{margin:18px 0 8px}
  .sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .sec-h b{font-size:15px}
  .sec-h span{font-size:13px;color:var(--ink-soft)}

  .row{border:1px solid var(--grid);border-radius:3px;background:#fff;margin-bottom:6px;padding:10px 12px}
  .row.need{background:linear-gradient(#FFF7B8,#FFF176);border-color:var(--hl-edge)}
  .row.t-retest{background:#FFE1DB;border-color:#E0A093}
  .row.t-vocab {background:linear-gradient(#FFF7B8,#FFF176);border-color:var(--hl-edge)}
  .row.t-blank {background:#D8E9FA;border-color:#93B9DF}
  .row.t-book  {background:#DCEFD8;border-color:#93C48C}
  .row.t-each  {background:#E7DDF8;border-color:#B2A0DA}
  .row.t-self  {background:#EFEFE9;border-color:#CFCEC3}
  .row.done{background:#F4F4EF;border-color:var(--grid);opacity:.6}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.18)}
  .sw.t-retest{background:#FFE1DB}.sw.t-vocab{background:#FFF176}.sw.t-blank{background:#D8E9FA}
  .sw.t-book{background:#DCEFD8}.sw.t-each{background:#E7DDF8}.sw.t-self{background:#EFEFE9}
  .wkitem{border-left:3px solid transparent;padding-left:6px}
  .wkitem.t-retest{border-left-color:#E0A093}
  .wkitem.t-vocab {border-left-color:var(--hl-edge)}
  .wkitem.t-blank {border-left-color:#93B9DF}
  .wkitem.t-book  {border-left-color:#93C48C}
  .wkitem.t-each  {border-left-color:#B2A0DA}
  .wkitem.t-self  {border-left-color:#CFCEC3}
  .top{display:flex;gap:9px;align-items:center}
  .check{width:23px;height:23px;flex:0 0 23px;border:1.5px solid var(--ink);border-radius:3px;background:#fff;cursor:pointer;font-size:14px;line-height:21px;text-align:center;padding:0;font-family:inherit;color:var(--ink)}
  .tg{font-family:inherit;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;
      border:1.5px solid rgba(0,0,0,.28);background:rgba(255,255,255,.7);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .tg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tg.pr.on{background:#1F7A3D;border-color:#1F7A3D}
  .code{font-weight:700;font-size:15px}
  .bk{font-family:inherit;font-size:12px;font-weight:500;color:var(--ink-soft);
      background:none;border:none;padding:0 0 0 5px;cursor:pointer;text-decoration:underline;
      text-decoration-style:dotted;text-underline-offset:2px}
  .qty{margin-left:auto;flex:0 0 auto;border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.7);border-radius:3px;font-size:13px;font-weight:700;padding:2px 8px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .qty.edited{border-color:var(--red);color:var(--red)}
  .what{font-size:14px;margin-top:3px}
  .what .num{font-size:19px;font-weight:700}
  .auto .what{color:var(--pen)}
  .fixed .what{color:var(--ink-soft)}
  .meta{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .warn{color:var(--red)}
  input.val,textarea.memo{width:100%;margin-top:6px;border:1px solid rgba(0,0,0,.18);border-radius:3px;background:rgba(255,255,255,.8);font-family:inherit;font-size:13px;padding:6px 8px}
  textarea.memo{resize:vertical;min-height:36px}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .rt{margin-top:8px;padding:10px;border:1px solid rgba(0,0,0,.25);border-radius:3px;background:rgba(255,255,255,.75)}
  .names{display:flex;flex-wrap:wrap;gap:5px}
  .nm{font-family:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--grid);border-radius:999px;background:#fff;color:var(--ink-soft);cursor:pointer}
  .nm.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .nm:active{transform:scale(.94);background:#DEDDD2}
  .nm.on:active{background:#444}
  .nm.ok{background:#1F7A3D;color:#fff;border-color:#1F7A3D}
  .nm.danger{background:#FFE1DB;color:var(--red);border-color:var(--red)}
  .nmrow{display:flex;align-items:center;gap:5px;margin-bottom:5px}
  .nmrow .mv{flex:0 0 106px;font-family:inherit;font-size:12px;padding:6px 4px;
    border:1px solid var(--grid);border-radius:3px;background:#fff;color:var(--ink-soft)}
  .nmrow input{flex:1;min-width:0;font-family:inherit;font-size:14px;padding:6px 8px;
    border:1px solid var(--grid);border-radius:3px;background:#fff;color:var(--ink)}
  .ar{width:32px;height:32px;flex:0 0 32px;font-family:inherit;font-size:12px;
    border:1px solid var(--grid);border-radius:3px;background:#fff;color:var(--ink-soft);cursor:pointer;padding:0}
  .ar:disabled{opacity:.3}
  .ar.danger{color:var(--red);border-color:var(--red);background:#FFF4F2}
  .confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px;
           padding:9px 10px;border:1px solid var(--red);border-radius:3px;background:#FFF4F2}
  .confirm span{font-size:13px;flex:1;min-width:120px}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .th{position:relative;display:inline-block}
  .th img{width:74px;height:74px;object-fit:cover;border:1px solid var(--grid);border-radius:3px;background:#fff;cursor:zoom-in}
  .thx.arm{border-color:var(--red);color:var(--red);font-weight:700}
  .thx{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--grid);background:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0;color:var(--ink-soft)}
  /* 시간표 · 서류 */
  .ttdays{display:flex;gap:6px;margin:14px 0 10px}
  .ttdays .chip{flex:1;text-align:center}
  .ttimg{display:block;border:1px solid var(--grid);border-radius:3px;overflow:hidden;background:#fff}
  .ttimg img{display:block;width:100%;height:auto}
  .doc{border:1px solid var(--grid);border-radius:3px;background:#fff;padding:14px;margin-bottom:10px}
  .doc h3{margin:0 0 4px;font-size:16px}
  .doc p{margin:0 0 12px;font-size:13px;color:var(--ink-soft);line-height:1.6}
  .doc .acts{display:flex;gap:8px;flex-wrap:wrap}
  .doc a.btn{text-decoration:none;display:inline-block}
  .doc.wait{background:transparent;border-style:dashed}
  .doc.wait h3{color:var(--ink-soft)}
  #lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:none;align-items:center;justify-content:center;padding:12px}
  #lb.on{display:flex}
  #lb img{max-width:100%;max-height:100%;object-fit:contain}
  .notebtn{border:1px solid rgba(0,0,0,.2);background:rgba(255,255,255,.65);border-radius:3px;padding:4px 9px;font-family:inherit;font-size:12px;color:var(--ink-soft);cursor:pointer}
  .notebtn:active{background:rgba(0,0,0,.06)}
  .notebtn.has{color:var(--red);border-color:var(--red)}
  .numbtn{font-family:inherit;font-size:19px;font-weight:700;border:none;background:none;padding:0 1px;color:inherit;cursor:pointer;border-bottom:2px dotted currentColor}
  .empty{border:1px dashed var(--grid);border-radius:3px;padding:16px 14px;text-align:center;color:var(--ink-soft);font-size:14px}

  .calbar{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
  .calbar b{font-size:18px}
  .cal{border:1px solid var(--grid);border-radius:3px;overflow:hidden;background:#fff}
  .calhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#F6F6F1;border-bottom:1px solid var(--grid)}
  .calhead div{text-align:center;font-size:12px;font-weight:600;padding:6px 0;color:var(--ink-soft)}
  .calhead .sun{color:var(--red)}.calhead .sat{color:#2F6FB5}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(74px,auto)}
  .cd{min-width:0;overflow:hidden;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:3px;cursor:pointer}
  .cd:nth-child(7n){border-right:none}
  .cd.out{background:#FAFAF7;opacity:.45}
  .cd.now{background:#FDFBE7}
  .cd.pick{outline:2px solid var(--ink);outline-offset:-2px}
  .cd.rng{background:#E8F1E6}
  .daterow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dchip{font-size:13px;font-weight:600;border:1px solid var(--grid);border-radius:999px;padding:4px 10px;background:#fff}
  .dchip.off{color:var(--ink-soft);font-weight:500}
  .cdn{font-size:12px;font-weight:600;margin-bottom:2px}
  .cdn.sun{color:var(--red)}.cdn.sat{color:#2F6FB5}
  .cev{font-size:10px;line-height:1.35;border-radius:2px;padding:1px 2px;margin-bottom:1px;letter-spacing:-.3px;
       overflow:hidden;white-space:normal;word-break:break-all;
       display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
  .c-hol{background:#FFDCD7;color:#8E2B22}
  .c-leave{background:#FFF176;color:#6B5A00}
  .c-mark{background:#D6E7FA;color:#1F4E80}
  .row.c-hol{background:#FFE8E4;border-color:#E3A99F}
  .row.c-leave{background:#FFF7B8;border-color:var(--hl-edge)}
  .row.c-mark{background:#E2EDFB;border-color:#9CBEE2}
  .cev.c-mark.off{background:#FFDCD7;color:#8E2B22}
  .offtag{white-space:nowrap;display:inline-block;font-size:11px;font-weight:700;color:#8E2B22;background:#FFDCD7;border-radius:3px;padding:1px 5px;margin-left:4px}
  .offchk{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
  .offchk input{width:18px;height:18px;margin:0}
  .sw.c-hol{background:#FFDCD7}.sw.c-leave{background:#FFF176}.sw.c-mark{background:#D6E7FA}
  .wk{border:1px solid var(--grid);border-radius:3px;overflow:hidden;background:#fff}
  .wkday{border-bottom:1px solid var(--grid);padding:9px 12px}
  .wkday:last-child{border-bottom:none}
  .wkday.today{background:#FDFBE7}
  .wkday h4{margin:0 0 5px;font-size:13px;font-weight:700}
  .wkday h4 em{font-style:normal;color:var(--ink-soft);font-weight:500;margin-left:4px}
  .wkday h4 i{font-style:normal;float:right;color:var(--ink-soft);font-weight:500}
  .wkitem{font-size:13px;padding:1px 0}
  .wkitem.v{background:linear-gradient(transparent 55%,var(--hl) 55%);display:block;width:fit-content}
  .wkitem.a{color:var(--pen)}
  .wkitem.f{color:var(--ink-soft)}

  .grp{margin-bottom:14px}
  .grp>h3{margin:0 0 6px;font-size:14px;font-weight:700;border-bottom:1px solid var(--grid);padding-bottom:4px;overflow:hidden}
  .item{border:1px solid var(--grid);border-radius:3px;background:#fff;padding:9px 10px;margin-bottom:6px}
  .srow{border:1px solid var(--grid);border-radius:3px;background:#fff;margin-bottom:5px;overflow:hidden}
  .srow.open{border-color:var(--ink)}
  .srow.isoff{opacity:.55}
  .sline{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
  .sline:active{background:#F6F6F1}
  .sline b{font-size:14px;min-width:46px}
  .sline span{flex:1;font-size:13px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sline em{font-style:normal;font-size:12px;color:var(--ink-soft)}
  .sline u{font-style:normal;text-decoration:none;font-size:11px;border:1px solid var(--red);border-radius:2px;padding:1px 4px}
  .sline i{font-style:normal;font-size:12px;color:var(--ink-soft);border:1px solid var(--grid);border-radius:3px;padding:2px 7px}
  .srow .fields,.srow .toolbar{margin:0 10px 10px}
  .daytag{font-size:12px;color:var(--ink-soft);margin:8px 0 2px}
  .item.isoff{opacity:.5}
  .line1{display:flex;gap:8px;align-items:center}
  .line1 b{flex:1;font-size:14px}
  .fields{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
  .fields label{font-size:11px;color:var(--ink-soft);display:block}
  .fields input,.fields select{width:100%;font-family:inherit;font-size:13px;padding:5px 6px;border:1px solid var(--grid);border-radius:3px;background:var(--paper);color:var(--ink)}
  .btn{font-family:inherit;font-size:13px;padding:7px 12px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
  .mini{border:1px solid var(--grid);background:#fff;border-radius:3px;font-size:12px;padding:3px 8px;cursor:pointer;font-family:inherit;color:var(--ink-soft);white-space:nowrap}
  .mini:active{background:var(--grid)}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
  .note{font-size:12px;color:var(--ink-soft);margin:6px 0 14px;line-height:1.65}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;z-index:50;opacity:0;transition:opacity .18s;pointer-events:none}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="datebar">
      <button class="nav" id="prev" aria-label="이전 날">‹</button>
      <h1 id="dtitle">—</h1>
      <button class="nav" id="next" aria-label="다음 날">›</button>
    </div>
    <div class="quick">
      <button class="chip" id="btoday">오늘</button>
      <button class="chip" id="btmr">내일</button>
      <input type="date" id="dpick" class="chip" style="padding:4px 10px">
      <button class="chip" id="bsync">최신으로</button>
      <button class="chip" id="binst" style="display:none;background:#3C7D69;color:#fff;border-color:#3C7D69">앱으로 설치</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-t="day">오늘 시험</button>
      <button class="tab" data-t="cal">달력</button>
      <button class="tab" data-t="tt">시간표</button>
      <button class="tab" data-t="doc">서류</button>
      <button class="tab" data-t="set">반 설정</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="imgin" accept="image/*" style="display:none">
<div id="lb"><img alt=""></div>

<script>
const DAYK=['일','월','화','수','목','금','토'];
const KIND={
  retest:{label:'재시험',cls:'need'},
  vocab:{label:'단어 (애들이 알려줌)',cls:'need'},
  each:{label:'각자 다름 (애들이 요청)',cls:'need'},
  blank:{label:'백지',cls:'auto'},
  book:{label:'교재 (Day 주마다 올라감)',cls:'auto'},
  manual:{label:'매번 범위 적기',cls:'auto'},
  set:{label:'내용 직접 적기',cls:'auto'},
  seq:{label:'순서대로 (자체교재)',cls:'fixed'},
  fixed:{label:'자체교재',cls:'fixed'}
};

/* 반별 인원 — 시간표 맨 아래 합계에서 읽음 */
const N={TWC:5,TPG:9,TPA:3,THA:6,TPP:10,TPV:7,TPD:7,'TPD-1':0,'TPD & TPD-1':7,TPC:10,THI:10,TPN:7,
  TPE:4,'TPE-1':6,'TPE & TPD':11,'TPE & TPE-1':10,
  TPH:10,TPT:9,TPW:10,TMA:3,TPQ:11,TPX:5,TPO:5,
  TMX:9,TMP:8,TMG:8,TMB:7,TPF:4,'TPF-1':0,TP1:5,TM1:8};

const SEEDV=22;
const APP_VER='1.77';

/* 반별 명단 — 시간표에서 읽음. 틀린 이름은 아래 ROSTER에서 고치면 됩니다. */
const HOL0=[
 ['2026-01-01','신정'],['2026-02-16','설 연휴'],['2026-02-17','설날'],['2026-02-18','설 연휴'],
 ['2026-03-01','삼일절'],['2026-03-02','대체공휴일'],['2026-05-05','어린이날'],
 ['2026-05-24','부처님오신날'],['2026-05-25','대체공휴일'],['2026-06-03','지방선거'],
 ['2026-06-06','현충일'],['2026-08-15','광복절'],
 ['2026-09-24','추석 연휴'],['2026-09-25','추석'],['2026-09-26','추석 연휴'],['2026-09-28','대체공휴일'],
 ['2026-10-03','개천절'],['2026-10-05','대체공휴일'],['2026-10-09','한글날'],['2026-12-25','성탄절'],
 ['2027-01-01','신정'],['2027-02-06','설 연휴'],['2027-02-07','설날'],['2027-02-08','설 연휴'],
 ['2027-02-09','대체공휴일'],['2027-03-01','삼일절'],['2027-03-03','대통령선거'],
 ['2027-05-05','어린이날'],['2027-05-13','부처님오신날'],['2027-06-06','현충일'],['2027-06-07','대체공휴일'],
 ['2027-08-15','광복절'],['2027-08-16','대체공휴일'],
 ['2027-09-14','추석 연휴'],['2027-09-15','추석'],['2027-09-16','추석 연휴'],
 ['2027-10-03','개천절'],['2027-10-04','대체공휴일'],['2027-10-09','한글날'],['2027-10-11','대체공휴일'],

function roster(cls){
  const R=(cfg&&cfg.roster)||ROSTER0;
  if(R[cls]&&R[cls].length)return R[cls];
  if(cls.indexOf('&')>=0){
    let out=[];
    cls.split('&').map(x=>x.trim()).forEach(p=>{ if(R[p]) out=out.concat(R[p]) });
    if(out.length)return out;
  }
  return R[cls]||[];
}

const skeyOf=i=>i.skey||[i.cls,i.kind,i.fmt||'',(i.once||i.wd||(i.wds||[]).join(''))].join('#');
function merge(old){
  const fresh=seed();
  // 같은 열쇠가 둘 이상이면 하나만 남김
  const dedup={}, kept=[];
  (old.items||[]).forEach(i=>{
    const k2=skeyOf(i);
    if(/^[umkr]/.test(i.id||'')){ kept.push(i); return }   // 직접 넣은 건 그대로
    if(dedup[k2])return;
    dedup[k2]=1; kept.push(i);
  });
  old=Object.assign({}, old, {items:kept});
  const have={};
  kept.forEach(i=>{ have[skeyOf(i)]=1 });
  const gone={};
  (old.removedKeys||[]).forEach(k2=>{ gone[k2]=1 });
  // 예전 것은 그대로 두고, 새로 생긴 것만 더함 (지운 건 되살리지 않음)
  const add=fresh.items.filter(i=>!have[skeyOf(i)]&&!gone[skeyOf(i)])
    .map(i=>Object.assign({},i,{id:'n'+Math.random().toString(36).slice(2,9)}));
  // 자체교재: 요일 고정 → 순서대로 로 바꾸기 (적어둔 교재 기록은 이어받음)
  const oldSelf=(old.items||[]).filter(i=>i.noprint&&i.kind==='book'
    &&(i.fmt==='영단어만 쓰기'||i.fmt==='뜻만 쓰기'));
  const keepBooks={}, keepName={};
  oldSelf.forEach(i=>{
    if(i.books&&!keepBooks[i.cls])keepBooks[i.cls]=i.books;
    const nm=i.ownBook||i.book;
    if(nm&&!keepName[i.cls])keepName[i.cls]=nm;
  });
  const seqCls={}; fresh.items.filter(i=>i.kind==='seq').forEach(i=>seqCls[i.cls]=1);
  old=Object.assign({}, old, {items:(old.items||[]).filter(i=>!(
    (seqCls[i.cls] && i.noprint && i.kind!=='seq' && !i.once)   // 자체교재 반의 옛 항목
    || (i.cls==='TP1'&&i.kind==='blank'&&i.wd===4)))});
  // 같은 반에 '순서대로'가 둘 이상이면 하나만 남김
  const seenSeq={};
  old=Object.assign({}, old, {items:(old.items||[]).filter(i=>{
    if(i.kind!=='seq')return true;
    if(seenSeq[i.cls])return false;
    seenSeq[i.cls]=1; return true;
  })});
  fresh.items.forEach(i=>{
    if(i.kind==='seq'&&keepBooks[i.cls])i.books=keepBooks[i.cls];
    if(i.kind==='seq'&&keepName[i.cls])i.book=keepName[i.cls];
  });

  // 'TPD & TPD-1' → 'TPD&TPD-1' 로 합치기
  (function(){
    const A='TPD&TPD-1', B='TPD & TPD-1';
    const R=old.roster||{};
    const merged=(R[A]||[]).concat((R[B]||[]).filter(x=>(R[A]||[]).indexOf(x)<0));
    if(R[A]!==undefined||R[B]!==undefined){
      old.roster=Object.assign({},R);
      delete old.roster[A];
      if(merged.length)old.roster[B]=merged; else delete old.roster[B];
    }
    if(old.teachers&&old.teachers[A]){
      old.teachers=Object.assign({},old.teachers);
      if(!old.teachers[B])old.teachers[B]=old.teachers[A];
      delete old.teachers[A];
    }
    if(old.books&&old.books[A]){
      old.books=Object.assign({},old.books);
      if(!old.books[B])old.books[B]=old.books[A];
      delete old.books[A];
    }
    (old.items||[]).forEach(i=>{ if(i.cls===A)i.cls=B });
  })();

  // TPF·TPF-1·TP1·TM1: 2026-10-20 부터 하루에 Day 하나씩
  if((old.v||0)<22){
    const D0='2026-10-20', BK={TPF:'워드마스터 수능 2000','TPF-1':'워드마스터 수능 2000',
      TP1:'뜯중 1800',TM1:'뜯중 1800'};
    ['TPF','TPF-1','TP1','TM1'].forEach(c=>{
      const olds=(old.items||[]).filter(i=>i.cls===c&&i.kind==='seq'&&!(i.until&&i.until<=D0));
      olds.forEach(i=>{ i.until=D0 });
      const keep=olds[0]||{};
      (old.items=old.items||[]).push({
        id:'n'+Math.random().toString(36).slice(2,9), cls:c, kind:'seq',
        book:keep.book||BK[c], books:keep.books, wds:[2,4],
        anchor:D0, from:D0, base:2, phase:0,
        pattern:['영단어·뜻 둘 다'], ul:'Day', noprint:true, sure:true, off:false
      });
    });
  }

  // 자체교재 반 순서를 한 번에 맞춤
  if((old.v||0)<14){
    const FIX={TMX:['2026-10-14',6],TMP:['2026-10-14',6],TMG:['2026-10-14',6],TMB:['2026-10-14',6],
               TPX:['2026-10-13',1],TPF:['2026-10-13',1],TP1:['2026-10-13',1],TM1:['2026-10-13',1]};
    const BK={TMX:'뜯중 1800',TMP:'뜯중 1800',TMG:'워드마스터 중등 실력',TMB:'뜯중 1200',
              TPX:'뜯중 1800',TPF:'워드마스터 수능 2000',TP1:'뜯중 1800',TM1:'뜯중 1800'};
    (old.items||[]).forEach(i=>{
      const f=FIX[i.cls];
      if(f&&i.kind==='seq'){
        i.anchor=f[0]; i.base=f[1]; i.phase=0;
        if(!i.book&&!i.books&&!i.ownBook)i.book=BK[i.cls];
      }
    });
  }

  // 반 이름 표기 통일: 'A&B' 와 'A & B' 를 하나로
  (function(){
    const fix=m=>{ if(!m)return m; const o={};
      Object.keys(m).forEach(k=>{ const n=normCls(k);
        if(o[n]===undefined)o[n]=m[k];
        else if(Array.isArray(o[n])&&Array.isArray(m[k]))
          m[k].forEach(v=>{ if(o[n].indexOf(v)<0)o[n].push(v) });
      });
      return o; };
    old.roster=fix(old.roster); old.teachers=fix(old.teachers); old.books=fix(old.books);
    (old.items||[]).forEach(i=>{ i.cls=normCls(i.cls) });
    old.removedCls=(old.removedCls||[]).map(normCls);
  })();

  const dead={}; (old.removedCls||[]).forEach(c=>dead[c]=1);
  const liveCls=x=>!dead[x];                  // 지운 반만. 합반은 따로

      const j=Object.assign({},i);
      delete j.base; delete j.anchor; delete j.step; delete j.ul;
      return j;
    }
    return i;
  }).filter(i=>liveCls(i.cls));
  out.removedCls=(old.removedCls||[]).slice();
  // 같은 번호를 쓰는 줄이 있으면 새 번호를 준다
  (function(){
    const used={}, mk=()=>{ let v; do{ v='x'+Math.random().toString(36).slice(2,9) }while(used[v]); return v };

      if(!i.id||used[i.id]) i.id=mk();

  out.cal=oldCal.concat((fresh.cal||[]).filter(e=>!hasDate[e.date]));
  return out;
}

const ROOM   = 'exam-tracker';     // 방 이름. 나눠 쓰려면 이것만 다르게
let rev = 0;

async function pullAll(){
  if(!WORKER){ try{ return JSON.parse(localStorage.getItem('tracker')||'{}') }catch(e){ return {} } }
  const r = await fetch(WORKER+'/load?room='+encodeURIComponent(ROOM));
  if(!r.ok) throw new Error('load');
  const j = await r.json();
  rev = j.rev || 0;
  return j.data || {};
}
async function pushAll(){
  const data = {cfg, logs};
  if(!WORKER){ localStorage.setItem('tracker', JSON.stringify(data)); return }
  rev++;
  const r = await fetch(WORKER+'/sync', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({room:ROOM, rev, data})});
  if(!r.ok) throw new Error('sync');
  const j = await r.json();
  if(j && j.ok===false && j.data){       // 다른 분이 먼저 저장함 → 그쪽을 따름
    rev = j.rev; cfg = j.data.cfg || cfg; logs = j.data.logs || logs;
    toast('다른 분이 먼저 고쳐서 그걸 불러왔어요'); render();
  }else if(j && j.rev){ rev = j.rev }
}

function shrink(file){
  return new Promise((ok,no)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=1500, sc=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*sc); c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        ok(c.toDataURL('image/jpeg',0.72));
      };
      im.onerror=no; im.src=fr.result;
    };
    fr.onerror=no; fr.readAsDataURL(file);
  });
}
async function upImg(dataUrl){
  if(!WORKER) return dataUrl;              // 혼자 쓰는 모드면 그대로 저장
  let r;
  try{
    r=await fetch(WORKER+'/img',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({data:dataUrl})});
  }catch(e){ throw new Error('Worker에 연결이 안 돼요') }
  if(r.status===404) throw new Error('Worker가 옛날 코드예요. 새 worker.js로 다시 Deploy 해주세요');
  let j=null;
  try{ j=await r.json() }catch(e){}
  if(!r.ok) throw new Error((j&&j.error) ? j.error : ('서버 오류 '+r.status));
  if(!j||!j.ok) throw new Error((j&&j.error)||'알 수 없는 오류');
  return j.id;
}

async function load(){
  try{
    const st = await pullAll();
    if(st.logs) logs = st.logs;
    if(st.cfg && st.cfg.v===SEEDV) cfg = st.cfg;
    else if(st.cfg && st.cfg.v>SEEDV) cfg = st.cfg;           // 이 기기 앱이 더 옛날 — 손대지 않음
    else if(st.cfg){ cfg = merge(st.cfg); await pushAll(); }  // 내용은 그대로, 새것만 더함
    else { cfg = seed(); await pushAll(); }
  }catch(e){
    memory = true;
    toast('저장소에 연결 못 했어요 — 이 화면에서만 유지됩니다');
  }
}
async function saveCfg(){ if(memory)return; try{ await pushAll() }catch(e){ memory=true; toast('저장 실패') } }
async function loadLog(mo){ if(!logs[mo]) logs[mo]={} }
async function saveLog(){ if(memory)return; try{ await pushAll() }catch(e){ memory=true; toast('저장 실패') } }
function entry(date,id){
  const mo=date.slice(0,7);
  const m=logs[mo]||(logs[mo]={});
  const d=m[date]||(m[date]={});
  return d[id]||(d[id]={});
}
function lastVal(id,before){
  let best=null;
  Object.keys(logs).forEach(mo=>{
    Object.keys(logs[mo]).forEach(dt=>{
      if(dt>=before)return;
      const e=logs[mo][dt][id];
      if(e&&e.val&&(!best||dt>best.dt))best={dt,val:e.val};
    });
  });
  return best;
}

/* 자체교재처럼 '수업하는 날마다 한 칸씩' 넘어가는 시험
   Day N 영단어 → 같은 Day 뜻 → Day N+1 영단어 … 요일이 아니라 순서로 셉니다 */
function seqIndex(it,date){
  const wds=it.wds||[];
  let d=it.anchor, k=0, g=0;
  while(d<date && g++<800){
    const w=parse(d).getDay();
    if(wds.indexOf(w)>=0 && !isHol(d) && !(it.skip||[]).includes(d)) k++;
    d=shift(d,1);
  }
  return (it.phase||0)+k;
}
function resolve(it,date,ignoreHol){
  if(it.off)return null;
  if(it.once){ if(it.once!==date)return null; }
  else{
    if(it.kind==='seq'){ if((it.wds||[]).indexOf(parse(date).getDay())<0)return null }
    else if(parse(date).getDay()!==it.wd)return null;
    if(it.from&&date<it.from)return null;
    if(it.skip&&it.skip.indexOf(date)>=0)return null;
    if(it.hide&&it.hide.indexOf(date)>=0)return null;
    if(isHol(date)&&!ignoreHol)return null;     // 공휴일 = 학원 쉼
    if(it.until&&date>=it.until)return null;   // 이 날부터 없앤 시험 (지난 기록은 남음)
    if(it.anchor&&it.base!=null&&date<it.anchor)return null;  // 번호 세는 기준 날 = 시작하는 날
  }
  const rn=headcount(it.cls);
  const ib=bookOfItem(it,date);
  const o={it,kind:it.kind,cls:it.cls,n:((it.kind==='retest'||it.nFix)? (it.n||0) : (rn||it.n||0)),sure:it.sure!==false,note:it.note||'',label:it.label||'',book:(ib||it.book||''),src:it.src||''};
  if(it.kind==='seq'){
    const pat=it.pattern||['영단어만 쓰기','뜻만 쓰기'];
    const idx=seqIndex(it,date);
    o.num=it.base+Math.floor(idx/pat.length);
    o.ul=it.ul||'Day';
    o.seqFmt=pat[idx%pat.length];
    o.invalid=o.num<1;
    return o;
  }
  if(it.base!=null&&it.anchor){
    const skipped=(it.skip||[]).filter(x=>x>it.anchor&&x<date).length + holSkips(it,date);
    o.num=it.base+it.step*(weeksBetween(it.anchor,date)-skipped);
    o.ul=it.ul||(it.kind==='book'?'Day':'Unit');
    o.invalid=o.num<1;
  }
  return o;
}
const CLSORD=['TWC','TPG','TPA','THA',
  'TPP','TPV','TPD','TPD-1','TPD & TPD-1','TPC','THI','TPN','TPE','TPE-1','TPE & TPE-1','TPE & TPD',
  'TPH','TPT','TPW','TMA','TPQ','TPX','TPO',
  'TMX','TMP','TMG','TMB','TPF','TPF-1','TP1','TM1'];
const CHOICES=[
 {v:'retest',t:'재시험',      kind:'retest'},
 {v:'vocab', t:'단어',        kind:'vocab'},
 {v:'blank', t:'백지',        kind:'blank'},
 {v:'t1200', t:'뜯중 1200',   kind:'set', book:'뜯중 1200'},
 {v:'t1800', t:'뜯중 1800',   kind:'set', book:'뜯중 1800'},
 {v:'wm',    t:'워드마스터',   kind:'set', book:'워드마스터'},
 {v:'rd',    t:'리딩튜터',     kind:'set', book:'리딩튜터'},
 {v:'self',  t:'자체교재',     kind:'set', book:'자체교재', noprint:true},
 {v:'each',  t:'각자 다름 (애들이 요청)', kind:'each'},
 {v:'free',  t:'직접 쓰기',    kind:'set'}
];
const choice=v=>CHOICES.find(c=>c.v===v)||CHOICES[0];
/* 자체교재 반이 쓰는 교재 — 반을 고르면 자동으로 붙습니다 */
function applyChoice(it,v,date,text,keep){
  const old={base:it.base,anchor:it.anchor,step:it.step,ul:it.ul,src:it.src,label:it.label,fmt:it.fmt};
  const c=choice(v);
  ['book','fmt','label','src','noprint','base','anchor','step','ul','names','round','rk']
    .forEach(k=>{ delete it[k] });
  if(v==='retest'){ it.kind='retest'; it.round=1; it.rk='vocab'; it.names=[]; it.src=text||'' ; return }
  if(v==='vocab'){ it.kind='vocab'; if(text)it.src=text; else if(keep&&old.src)it.src=old.src; return }
  if(v==='blank'){ it.kind='blank'; if(text)it.src=text; else if(keep&&old.src)it.src=old.src; return }
  if(v==='each'){ it.kind='each'; it.src=text||(keep&&old.src)||bookOf(it.cls,date)||''; return }
  if(v==='free'){ it.kind='set'; it.label=text||(keep&&old.label)||'시험'; return }
  if(v==='self'){
    it.kind='book'; it.noprint=true; it.book=bookOf(it.cls,date)||'자체교재';
    it.base=parseInt((text||'').replace(/\D/g,''),10)||1; it.anchor=date; it.step=1; it.ul='Day';
    if(keep&&old.base!=null){ it.base=old.base; it.anchor=old.anchor||date; it.step=old.step||1; if(old.ul)it.ul=old.ul; if(old.fmt)it.fmt=old.fmt }
    return;
  }
  it.kind='book'; it.book=c.book||'교재';
  it.base=parseInt((text||'').replace(/\D/g,''),10)||1; it.anchor=date; it.step=1;
  it.ul = v==='rd' ? '과' : 'Day';
  if(keep&&old.base!=null){ it.base=old.base; it.anchor=old.anchor||date; it.step=old.step||1; if(old.ul)it.ul=old.ul; if(old.fmt)it.fmt=old.fmt }
}
const bookFor=(v,cls)=>{
  const c=CHOICES.find(x=>x.v===v);
  if(!c)return '';
  if(v==='self'){ const b=bookOf(cls,sel); return '자체교재'+(b?' '+b:'') }
  return c.book||'';
};
const RCH=CHOICES.filter(c=>c.v!=='retest');          // 재시험 안에서 고르는 시험 종류
function rkLabel(rk,src,cls){
  const head=bookFor(rk,cls);
  if(head)return [head,src].filter(Boolean).join(' ');
  const c=CHOICES.find(x=>x.v===rk);
  const t=(c&&['vocab','blank','each'].indexOf(rk)>=0)?c.t:'';
  return [t,src].filter(Boolean).join(' ');
}
const roundName=n=>'재'.repeat(Math.max(1,n||1))+'시험';
/* 그 날짜에 쓰던 교재 — 바꾼 날 이전은 예전 교재가 그대로 남습니다 */
function bookOf(cls,date){
  const h=(cfg.books||{})[cls];
  if(!h)return '';
  let best='', bk='';
  Object.keys(h).forEach(d=>{ if(d<=date && d>=best){ best=d; bk=h[d] } });
  return bk;
}
/* 그 시험이 그날 쓰던 교재 — 바꾼 날 이전은 예전 교재가 그대로 남습니다 */
function bookOfItem(it,date){
  const h=it.books;
  if(!h)return '';
  let best='', bk='';
  Object.keys(h).forEach(d=>{ if(d<=date && d>=best){ best=d; bk=h[d] } });
  return bk;
}
function setRoster(c,arr){
  cfg.roster=cfg.roster||{};
  cfg.roster[c]=arr.slice().sort((x,y)=>x.localeCompare(y,'ko'));
}
function setItemBook(it,date,name){
  it.books=it.books||{};
  if(name) it.books[date]=name; else delete it.books[date];
  if(!Object.keys(it.books).length) delete it.books;
}
function teacherOf(cls){
  const T=(cfg&&cfg.teachers)||{};
  if(T[cls])return T[cls];
  const ps=cls.split('&').map(x=>x.trim()).map(x=>T[x]).filter(Boolean);
  return ps.length?Array.from(new Set(ps)).join('·'):'';
}
function setBook(cls,date,name){
  cfg.books=cfg.books||{};
  cfg.books[cls]=cfg.books[cls]||{};
  if(name) cfg.books[cls][date]=name; else delete cfg.books[cls][date];
}
const cidx=c=>{const i=CLSORD.indexOf(c);return i<0?900:i};
function headcount(cls){
  const r=roster(cls).length;
  if(r)return r;
  if(cls.indexOf('&')>=0)
    return cls.split('&').map(x=>x.trim()).reduce((a,p)=>a+(roster(p).length||N[p]||0),0);
  return N[cls]||0;
}
function allClasses(){
  const set={};
  cfg.items.forEach(i=>set[i.cls]=1);
  Object.keys((cfg&&cfg.roster)||{}).forEach(c=>set[c]=1);
  return Object.keys(set).sort((a,b)=>cidx(a)-cidx(b)||a.localeCompare(b));
}
function rank(r){
  if(r.kind==='retest')return -1;
  if(!prints(r))return 90;
  if(r.kind==='vocab'||r.kind==='each')return 0;
  const gi=BOOKG.findIndex(g=>g.f(r));
  return 10+(gi<0?BOOKG.length:gi);
}
function forDate(d){
  return cfg.items.map(i=>resolve(i,d)).filter(Boolean)
    .sort((a,b)=>rank(a)-rank(b)||cidx(a.cls)-cidx(b.cls)||a.cls.localeCompare(b.cls));
}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qtyOf=(r)=>{const e=entry(sel,r.it.id);return e.qty!=null?e.qty:r.n};
const prints=(r)=>r.kind==='retest'||!(r.it.noprint||r.kind==='fixed');  // 재시험은 늘 다시 뽑음
function vOf(it){
  if(it.kind==='seq')return 'self';
  if(it.kind==='retest')return 'retest';
  if(it.kind==='vocab')return 'vocab';
  if(it.kind==='blank')return 'blank';
  if(it.kind==='each')return 'each';
  if(it.noprint)return 'self';
  const b=it.book||'';
  if(/뜯중\s*1200/.test(b))return 't1200';
  if(/뜯중\s*1800/.test(b))return 't1800';
  if(/워드마스터/.test(b))return 'wm';
  if(/리딩튜터/.test(b))return 'rd';
  return 'free';
}
function rangeOf(r){
  const e=entry(sel,r.it.id);
  if(r.kind==='set')return r.label||'';
  if(r.kind==='seq')return (r.ul||'Day')+' '+(r.num!=null?r.num:'')+(r.seqFmt?' · '+r.seqFmt:'');
  if(r.kind==='book')return (r.ul||'Day')+' '+(r.num!=null?r.num:'')+(r.it.fmt?' · '+r.it.fmt:'');
  if(r.kind==='blank')return e.val||r.src||'';
  if(r.kind==='manual')return e.val||'';
  if(r.kind==='retest')return r.src||'';
  let t=r.src||'';
  if(r.num!=null)t=(t?t+' ':'')+(r.ul||'Unit')+' '+r.num;
  if(!t&&e.memo)t=e.memo.replace(/\s+/g,' ').slice(0,40);
  return t;
}
function rowBook(r){
  return bookOfItem(r.it,sel) || r.it.ownBook || ((r.kind==='book'||r.kind==='seq')? (r.book||'') : '') || bookOf(r.cls, sel);
}
function tintOf(r){
  if(r.kind==='retest')return 't-retest';
  if(r.kind==='each')return 't-each';
  if(r.kind==='vocab')return 't-vocab';
  if(!prints(r))return 't-self';
  if(r.kind==='blank')return 't-blank';
  return 't-book';
}
const isAsk=(r)=>r.kind==='vocab'||r.kind==='each'||r.kind==='retest';
const BOOKG=[
  {t:'백지',       f:r=>r.kind==='blank'},
  {t:'뜯중 1200', f:r=>/뜯중\s*1200/.test(r.book)},
  {t:'뜯중 1800', f:r=>/뜯중\s*1800/.test(r.book)},
  {t:'워드마스터', f:r=>/워드마스터/.test(r.book)},
  {t:'따로',      f:()=>true}
];
const bookGroup=r=>(BOOKG.find(g=>g.f(r))||BOOKG[BOOKG.length-1]).t;

function content(r){
  const unit=r.num!=null?' <button class="numbtn" data-fix="'+r.it.id+'">'+r.ul+' '+(r.invalid?'?':r.num)+'</button>':'';
  if(r.kind==='retest'){
    const w=r.it.rk?rkLabel(r.it.rk,r.src,r.cls):(r.src||'');
    return '<span style="color:var(--red);font-weight:700">'+roundName(r.it.round)+'</span>'
      +(w?' <span>'+esc(w)+'</span>':'');
  }
  if(r.kind==='vocab')return '단어시험';
  if(r.kind==='blank'){
    const v=entry(sel,r.it.id).val||r.src;
    return '백지'+(v?' <span style="color:var(--ink-soft)">· '+esc(v)+'</span>':'');
  }
  if(r.kind==='fixed')return '자체교재'+(r.note?' · '+esc(r.note):'');
  if(r.kind==='set')return esc(r.label);
  if(r.kind==='each')return (r.src?esc(r.src):'각자 다름')
    +' <span style="color:var(--ink-soft)">· 매번 바뀜, 아래에 직접 쓰기</span>';
  if(r.kind==='seq'){
    const head=r.it.noprint?'자체교재':esc(r.book||'교재');
    return head+unit+(r.seqFmt?' <span style="color:var(--ink)">· '+esc(r.seqFmt)+'</span>':'');
  }
  if(r.kind==='book'){
    const head=r.it.noprint?'자체교재':esc(r.book);
    const tail='';
    return head+unit+(r.it.fmt?' <span style="color:var(--ink)">· '+esc(r.it.fmt)+'</span>':'')+tail;
  }
  return esc(r.book||'직접 입력');
}

  const e=entry(sel,r.it.id), id=r.it.id, k=KIND[r.kind].cls;
  const q=qtyOf(r), edited=e.qty!=null&&e.qty!==r.n;

  let h='<div class="row '+k+' '+tintOf(r)+'"><div class="top">';
  if(needPrint)
    h+='<button class="tg pr'+(e.pr?' on':'')+'" data-pr="'+id+'">'+(e.pr?'뽑음 ✓':'뽑기')+'</button>';
  const bk=rowBook(r), tc=teacherOf(r.cls);
  h+='<div class="code">'+esc(r.cls)
   +'<button class="bk" data-edt="book|'+id+'">('+(bk?esc(bk):'교재 적기')+')</button>'
   +'<button class="bk" data-edt="tch|'+id+'">'+(tc?esc(tc):'담임')+'</button></div>';
  h+= prints(r)
    ? '<button class="qty'+(edited?' edited':'')+'" data-edt="qty|'+id+'">'+q+'장</button>'
    : '<button class="qty" data-edt="qty|'+id+'" style="opacity:.55">'+q+'명</button>';

  if(r.it.once)h+='<div class="meta">이 날만</div>';
  if(r.note)h+='<div class="meta" style="color:var(--red)">'+esc(r.note)+'</div>';
  if(e.note)h+='<div class="meta" style="color:var(--red)">'+d2s(sel)+' · '+esc(e.note)+'</div>';
  if(!r.sure)h+='<div class="meta warn">확인 필요</div>';
  if(r.invalid)h+='<div class="meta warn">Day가 1보다 작아요. 번호를 고쳐주세요.</div>';

  if(r.kind==='manual'||r.kind==='each'||r.kind==='blank'){
    const lv=lastVal(id,sel);
    h+='<input class="val" data-val="'+id+'" value="'+esc(e.val||'')+'" placeholder="'+(lv?'지난번('+lv.dt.slice(5)+'): '+esc(lv.val):(r.kind==='each'?'이 날 뽑을 것 직접 쓰기 — 예: Day45 1명(40문제) / Day12·13 2명(80문제)'
        :r.kind==='blank'?'어떤 시험인지 — 예: 품사':'이번에 볼 범위 입력'))+'">';
  }
  if(r.kind==='vocab')
    h+='<textarea class="memo" data-memo="'+id+'" placeholder="받은 단어 / 범위">'+esc(e.memo||'')+'</textarea>';
  if(r.kind==='retest'&&(r.it.names||[]).length){
    const nm=r.it.names, ps=e.pass||{};
    h+='<div class="names" style="margin-top:8px">'
      + nm.map(x=>'<button class="nm'+(ps[x]?' ok':'')+'" data-pass="'+id+'|'+esc(x)+'">'+esc(x)+(ps[x]?' ✓':'')+'</button>').join('')
      + '</div>';
    const done=nm.filter(x=>ps[x]).length;
    h+='<div class="meta">통과 '+done+' / '+nm.length+(done===nm.length?' · 다 끝났어요':'')+'</div>';
  }
  if((e.imgs||[]).length){
    h+='<div class="thumbs">'+e.imgs.map((v,i)=>
      '<span class="th"><img src="'+esc(imgSrc(v))+'" data-big="'+esc(imgSrc(v))+'" alt="답지">'
      +'<button class="thx'+(armed==='img'+id+i?' arm':'')+'" data-delimg="'+id+'|'+i+'">'
      +(armed==='img'+id+i?'!':'✕')+'</button></span>').join('')+'</div>';
  }
  const acts=[];
  acts.push('<button class="notebtn" data-img="'+id+'">답지 사진'+((e.imgs||[]).length?' '+e.imgs.length+'장':' 넣기')+'</button>');
  if(r.kind==='retest')
    acts.push('<button class="notebtn" data-edt="names|'+id+'">누가 보는지 고치기</button>');
  if(r.kind==='retest'&&(r.it.names||[]).length){
    const left=(r.it.names).filter(x=>!(e.pass||{})[x]);
    if(left.length&&left.length<r.it.names.length)
      acts.push('<button class="notebtn" data-next="'+id+'">남은 '+left.length+'명 '+roundName((r.it.round||1)+1)+' 잡기</button>');
  }
  if(r.num!=null)acts.push('<button class="notebtn" data-edt="num|'+id+'">'+r.ul+' 번호 고치기</button>');
  acts.push('<button class="notebtn'+((e.note||r.it.note)?' has':'')+'" data-edt="note|'+id+'">'
    +((e.note||r.it.note)?'특이사항 있음':'특이사항 적기')+'</button>');
  acts.push('<button class="notebtn" data-rt="'+id+'">재시험 잡기</button>');
  acts.push(r.it.once
    ? '<button class="notebtn" data-edt="move|'+id+'">날짜 바꾸기</button>'
    : '<button class="notebtn" data-edt="off|'+id+'">오늘 시험 X</button>');
  acts.push('<button class="notebtn" data-edt="kind|'+id+'">종류 바꾸기</button>');
  acts.push('<button class="notebtn" data-edt="del|'+id+'">'
    +(r.it.once?'이 시험 지우기':'매주 없애기')+'</button>');
  h+='<div class="acts">'+acts.join('')+'</div>';
  if(edt&&edt.id===id)h+=edtPanel(r);
  if(rtOpen===id)h+=rtPanel(r);

  return h+'</div>';
}

      +'<option value="date"'+(v==='date'?' selected':'')+'>다른 날에 — 날짜 고르기</option>'
      +'<option value="none"'+(v==='none'?' selected':'')+'>안 봄 (그냥 넘기기)</option>'
      +'</select></div>'
      +(v==='date'?'<div style="grid-column:1/-1"><label>언제 볼까요</label>'

  if(t==='skip'){

      +'</select></div></div>', '오늘 시험 빼기');
  }
  return '';
}

function viewDay(){
  const rows=forDate(sel), wd=parse(sel).getDay();
  const pr=rows.filter(prints);
  const sheets=pr.reduce((s,r)=>s+qtyOf(r),0);
  const donep=pr.filter(r=>entry(sel,r.it.id).pr);
  const doneN=donep.reduce((s,r)=>s+qtyOf(r),0);
  const left=sheets-doneN;
  let h='<div class="total"><b>'+left+'</b><span>장 더 뽑으면 돼요'
    +(doneN?' · '+doneN+'장 뽑음':'')+' · 전체 '+sheets+'장</span></div>'
    +(sheets&&left===0?'<div class="rule" style="border-left-color:#1F7A3D;background:#EDF7EE">오늘 뽑을 거 다 뽑았어요</div>':'');
  if(isHol(sel))h+='<div class="rule" style="border-left-color:var(--red);background:#FFF1EE">'
    +'<b>'+esc(holName(sel)||'공휴일')+'</b> · 학원 쉬는 날이라 매주 있는 시험은 안 나와요. '
    +'여는 날이면 달력 탭에서 이 날 공휴일 표시나 \'수업 없음\' 체크를 지우세요.</div>';
  if(RULES[wd])h+='<div class="rule">'+RULES[wd]+'</div>';
  h+= addOpen ? addForm() : '<div class="toolbar" style="margin:10px 0 0"><button class="btn ghost" data-once="1">＋ 시험 / 재시험 추가</button></div>';
  if(!rows.length)return h+'<div class="sec"><div class="empty">이 날은 0교시 시험이 없어요.</div></div>';

  const isNeed=r=>r.kind==='vocab'||r.kind==='each'||r.kind==='retest';
  const need=rows.filter(isNeed);
  const mine=rows.filter(r=>!isNeed(r)&&prints(r));
  const self=rows.filter(r=>!isNeed(r)&&!prints(r));
  const sec=(t,sub,list,empty,tint)=>'<div class="sec"><div class="sec-h"><b>'
    +(tint?'<span class="sw '+tint+'"></span>':'')+t+'</b><span>'+sub+'</span></div>'
    +(list.length?list.map(rowHTML).join(''):'<div class="empty">'+empty+'</div>')+'</div>';
  const rt=need.filter(r=>r.kind==='retest'), nd=need.filter(r=>r.kind!=='retest');
  if(rt.length)h+=sec('재시험', rt.reduce((a,r)=>a+qtyOf(r),0)+'장', rt, '없음', 't-retest');
  h+=sec('단어', nd.reduce((a,r)=>a+qtyOf(r),0)+'장', nd, '없음', 't-vocab');
  BOOKG.forEach(g=>{
    const list=mine.filter(r=>bookGroup(r)===g.t);
    if(list.length)h+=sec(g.t,
      list.filter(r=>!entry(sel,r.it.id).pr).reduce((a,r)=>a+qtyOf(r),0)+' / '
      +list.reduce((a,r)=>a+qtyOf(r),0)+'장', list, '없음',
      g.t==='백지'?'t-blank':'t-book');
  });
  h+=sec('자체교재', '뽑지 말고 Day만 적어주기', self, '없음', 't-self');
  if(isHol(sel)){
    const off=cfg.items.map(i=>resolve(i,sel,true)).filter(Boolean)
      .filter(r=>!r.it.once&&!(r.it.did||[]).includes(sel))
      .sort((a,b)=>rank(a)-rank(b)||cidx(a.cls)-cidx(b.cls));
    if(off.length){
      h+='<div class="sec"><div class="sec-h"><b>쉬는 날이라 빠진 시험</b>'
       +'<span>다른 날에 보려면 옮기세요</span></div>';
      off.forEach(r=>{
        h+='<div class="row fixed" style="opacity:.75"><div class="top">'
         +'<div class="code">'+esc(r.cls)+'</div>'
         +'<div style="margin-left:auto;font-size:12px;color:var(--ink-soft)">'+(r.n||0)+'명</div></div>'
         +'<div class="what" style="color:var(--ink-soft)">'+content(r)+'</div>'
         +'<div class="acts"><button class="notebtn" data-edt="move|'+r.it.id+'">다른 날로 옮기기</button></div>'
         +(edt&&edt.id===r.it.id?edtPanel(r):'')
         +'</div>';
      });
      h+='</div>';
    }
  }
  return h;
}

      ? '<div style="font-size:11px;color:var(--ink-soft);margin:8px 0 4px">누가 보나요 (여러 명)</div><div class="names">'

  }

     +(sameKind?'<br><b>같은 종류예요. 그래도 넣으면 두 개가 됩니다.</b>':'')
     +'</div>';
  }
  h+='<div style="margin-top:10px">'
   +(afImgs.length?'<div class="thumbs">'+afImgs.map((v,i)=>
      '<span class="th"><img src="'+esc(imgSrc(v))+'" data-big="'+esc(imgSrc(v))+'" alt="답지">'
      +'<button class="thx" data-aimgdel="'+i+'">✕</button></span>').join('')+'</div>':'')
   +'<button class="notebtn" data-aimg="1" style="margin-top:6px">답지 사진'
   +(afImgs.length?' '+afImgs.length+'장 · 더 넣기':' 넣기')+'</button></div>';
  h+='<div class="toolbar"><button class="btn" data-addok="1">'
   +(sameKind&&armed==='dup'?'그래도 넣기':'추가')+'</button>'
   +'<button class="btn ghost" data-addcancel="1">취소</button></div></div>';
  return h;
}

function viewWeek(){
  const mo=monday(sel), today=ymd(new Date());
  let h='<div class="sec"><div class="wk">';
  for(let i=0;i<5;i++){
    const d=new Date(mo); d.setDate(d.getDate()+i);
    const ds=ymd(d), rows=forDate(ds);
    const sh=rows.filter(r=>!(r.it.noprint||r.kind==='fixed')).reduce((s,r)=>s+(r.n||0),0);
    h+='<div class="wkday'+(ds===today?' today':'')+'"><h4>'+DAYK[d.getDay()]+'<em>'+(d.getMonth()+1)+'.'+d.getDate()+'</em>'+(sh?'<i>'+sh+'장</i>':'')+'</h4>';
    if(isHol(ds))h+='<div class="wkitem" style="color:var(--red)">'+esc(holName(ds)||'공휴일')+' · 쉼</div>';
    else if(!rows.length)h+='<div class="wkitem f">시험 없음</div>';
    rows.forEach(r=>{
      const c=(r.kind==='vocab'?'v':r.kind==='fixed'?'f':'a')+' '+tintOf(r);
      const t=r.kind==='retest'?(roundName(r.it.round)+' '+(r.it.rk?rkLabel(r.it.rk,r.src,r.cls):(r.src||''))):r.kind==='vocab'?((r.src||'단어')+(r.num!=null?' '+r.ul+' '+(r.invalid?'?':r.num):'')):r.kind==='each'?'각자 다름':r.kind==='blank'?'백지':r.kind==='fixed'?'자체교재'
        :r.kind==='set'?r.label:r.kind==='book'?(r.it.noprint?'자체교재':r.book)+' '+(r.ul||'Day')+' '+(r.invalid?'?':r.num)+(r.it.fmt?' '+r.it.fmt:''):r.book;
      const tt2=teacherOf(r.cls);
      h+='<div class="wkitem '+c+'"><b>'+esc(r.cls)+'</b>'+(tt2?' <span style="color:var(--ink-soft);font-size:11px">'+esc(tt2)+'</span>':'')+' '+esc(t)+' <span style="color:var(--ink-soft)">'+(r.n||0)+(prints(r)?'장':'명')+'</span></div>';
    });
    h+='</div>';
  }
  return h+'</div></div><div class="note">왼쪽 색은 오늘 시험 화면과 같아요. <span class="sw t-retest"></span>재시험 <span class="sw t-vocab"></span>단어 <span class="sw t-blank"></span>백지 <span class="sw t-book"></span>뜯중·워드마스터 <span class="sw t-each"></span>각자 다름 <span class="sw t-self"></span>자체교재. 오른쪽 장수는 자체교재를 뺀 숫자예요.</div>';
}

function itemSummary(it){
  const bk=it.ownBook||'';
  const add=t=>[t,bk,it.src].filter(Boolean).join(' · ');
  if(it.kind==='vocab')return add('단어');
  if(it.kind==='each')return add('각자 다름')+' · 매번 바뀜';
  if(it.kind==='blank')return add('백지');
  if(it.kind==='retest')return add(roundName(it.round));
  if(it.kind==='set')return it.label||'내용 직접';
  if(it.kind==='manual')return (it.book||'')+' · 직접 입력';
  if(it.kind==='fixed')return '자체교재';
  if(it.kind==='seq')return (it.noprint?'자체교재':(it.book||'교재'))
    +' '+(it.ul||'Day')+' 순서대로 · '+(it.wds||[]).map(w=>DAYK[w]).join('·');
  if(it.kind==='book')return (it.noprint?'자체교재':(it.book||'교재'))
    +' '+(it.ul||'Day')+' 자동'+(it.fmt?' · '+it.fmt:'');
  return it.kind;
}

const d2s=d=>d.slice(5).replace('-','/');
/* 달력에 공휴일로 표시된 날 = 학원 쉬는 날. 지우면 그날은 여는 날이 됩니다 */
/* 중요한 날 중 '수업 없음'에 체크한 날(할로윈데이 등)도 공휴일과 똑같이 쉬는 날로 칩니다 */
const offEv=e=>e.type==='hol'||(e.type==='mark'&&e.off);
function isHol(d){ return (cfg.cal||[]).some(e=>offEv(e)&&e.date===d) }
function holName(d){ const e=(cfg.cal||[]).find(x=>offEv(x)&&x.date===d); return e?e.text:'' }
function holSkips(it,date){
  if(!it.anchor||it.wd==null)return 0;
  let d=it.anchor, g=0;
  while(parse(d).getDay()!==it.wd && g++<7) d=shift(d,1);
  let n=0, guard=0;
  const did=it.did||[];
  while(d<date && guard++<520){ if(isHol(d)&&did.indexOf(d)<0)n++; d=shift(d,7) }
  return n;
}
function calOf(d){ return (cfg.cal||[]).filter(e=>e.date===d) }
function viewCal(){
  const base=calMo||sel.slice(0,7);
  const [y,m]=base.split('-').map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const start=new Date(first); start.setDate(1-first.getDay());
  const today=ymd(new Date());
  let h='<div class="calbar"><button class="nav" data-cm="-1">‹</button>'
   +'<b>'+y+'년 '+m+'월</b><button class="nav" data-cm="1">›</button>'
   +'<button class="chip" data-cm="0" style="margin-left:auto">이번 달</button></div>'
   +'<div class="cal"><div class="calhead">'
   +['일','월','화','수','목','금','토'].map((d,i)=>'<div class="'+(i===0?'sun':i===6?'sat':'')+'">'+d+'</div>').join('')
   +'</div><div class="calgrid">';
  for(let i=0;i<42;i++){
    const dt=new Date(start); dt.setDate(start.getDate()+i);
    const ds=ymd(dt), out=dt.getMonth()!==m-1;
    if(i>=35 && out) continue;
    const ev=calOf(ds);
    const hol=ev.some(offEv);
    const inRange = calAdd && ds>=calAdd.start && ds<=(calAdd.end||calAdd.start);
    h+='<div class="cd'+(out?' out':'')+(ds===today?' now':'')+(ds===calDay?' pick':'')
      +(inRange?' rng':'')+'" data-cd="'+ds+'">'

    const sheets=list.filter(i=>!i.off&&!(i.noprint||i.kind==='fixed'))

      +(op?'<button class="mini" style="float:right" data-addday="'+w+'">추가</button>':'')+'</h3>';
    if(op)h+= list.length? list.map(setRow).join('') : '<div class="empty">시험 없음</div>';
    h+='</div>';
  }
  const dead=act.filter(i=>!i.once&&(i.off||(i.until&&i.until<=sel)));
  if(dead.length){
    h+='<div class="grp"><h3 data-sec="dead" style="cursor:pointer">'+(showDead?'▾':'▸')
      +' 없앤 시험 <span style="font-weight:500;color:var(--ink-soft)">'+dead.length+'개</span></h3>';
    if(showDead)h+=dead.sort((a,b)=>cidx(a.cls)-cidx(b.cls)).map(setRow).join('');

  return h;

      rtRound=Math.min(3,(src.round||1)+1);
      rtKind=src.rk||'vocab'; rtWhat=src.src||'';
    }else{
      rtRound=1;
      const rr=forDate(sel).find(x=>x.it.id===src.id);
      rtWhat = rr ? rangeOf(rr) : '';
      rtKind = vOf(src);
      if(rtKind==='free'&&src.kind==='book'&&src.book)
        rtWhat = (src.book+' '+rtWhat).trim();   // 목록에 없는 교재면 이름째로
    }
    render();
  });
  document.querySelectorAll('[data-bkdel]').forEach(b=>b.onclick=async()=>{
    const [id,d]=b.dataset.bkdel.split('|');
    const it=cfg.items.find(x=>x.id===id);
    if(it&&it.books){ delete it.books[d]; if(!Object.keys(it.books).length)delete it.books }
    await saveCfg(); render();
  });
  document.querySelectorAll('[data-edt]').forEach(b=>b.onclick=()=>{
    const [type,id]=b.dataset.edt.split('|');
    if(edt&&edt.id===id&&edt.type===type){ edt=null; rtOpen=null; render(); return }
    edt={id,type,v:null};
    if(type==='names'){
      const it=cfg.items.find(x=>x.id===id), sl={};
      (it.names||[]).forEach(x=>sl[x]=true);
      edt.sel=sl;
    }
    rtOpen=null; render();
  });
  document.querySelectorAll('[data-nmtg]').forEach(b=>b.onclick=()=>{
    const ev=document.querySelector('#ev'); if(ev)edt.v=ev.value;
    const k=b.dataset.nmtg; edt.sel=edt.sel||{}; edt.sel[k]=!edt.sel[k]; render();
  });
  const eno=document.querySelector('[data-eno]');
  if(eno)eno.onclick=()=>{edt=null;render()};
  const evsel=document.querySelector('#ev');
  if(evsel&&edt&&edt.type==='off')evsel.onchange=()=>{
    edt.v=evsel.value;
    edt.v2=(document.querySelector('#ev2')||{}).value||'';
    render();
  };
  if(evsel&&edt&&edt.type==='kind')evsel.onchange=()=>{
    edt.v=evsel.value;
    edt.v2=(document.querySelector('#ev2')||{}).value||'';
    edt.v3=(document.querySelector('#ev3')||{}).value||'one';
    render();
  };
  const eok=document.querySelector('[data-eok]');
  if(eok)eok.onclick=async()=>{
    const it=cfg.items.find(x=>x.id===edt.id), t=edt.type;
    const ev=document.querySelector('#ev'), val=ev?ev.value:'';
    const mo=sel.slice(0,7);

    if(t==='qty'){
      const n=parseInt(val,10); if(isNaN(n)){toast('숫자를 넣어주세요');return}
      entry(sel,it.id).qty=n; edt=null; await saveLog(mo); render(); return;
    }
    if(t==='num'){
      const n=parseInt(val,10); if(isNaN(n)){toast('숫자를 넣어주세요');return}
      if(it.kind==='seq'){
        const pat=it.pattern||['영단어만 쓰기','뜻만 쓰기'];
        const pick=(document.querySelector('#ev2')||{}).value;
        const p=Math.max(0,pat.indexOf(pick!==undefined?pick:pat[0]));
        const now=seqIndex(it,sel);
        const want=(n-(it.base||1))*pat.length+p;
        it.phase=(it.phase||0)+(want-now);
      }else{
        const rr=resolve(it,sel,true);
        if(rr&&rr.num!=null) it.base += (n - rr.num);
        else { it.anchor=sel; it.base=n }
      }
      it.sure=true;
      edt=null; await saveCfg(); render(); toast('오늘부터 맞췄어요'); return;
    }
    if(t==='note'){
      entry(sel,it.id).note=val;
      const nt=((document.querySelector('#ev2')||{}).value||'').trim();
      if(nt)it.note=nt; else delete it.note;
      edt=null; await saveCfg(); await saveLog(mo); render(); toast('저장'); return;
    }
    if(t==='names'){
      const picked=Object.keys(edt.sel||{}).filter(k=>edt.sel[k]);
      const extra=(val||'').split(/[,\u00b7\/\n]/).map(x=>x.trim()).filter(Boolean);
      const names=picked.concat(extra.filter(x=>picked.indexOf(x)<0));
      it.names=names; it.n=names.length||1;
      edt=null; await saveCfg(); render(); toast(names.length+'명으로 바꿨어요'); return;
    }
    if(t==='tch'){
      cfg.teachers=cfg.teachers||{};
      if(val.trim())cfg.teachers[it.cls]=val.trim(); else delete cfg.teachers[it.cls];
      edt=null; await saveCfg(); render(); toast('담임 저장'); return;
    }
    if(t==='book'){
      const d2=(document.querySelector('#ev2')||{}).value||sel;
      setItemBook(it, d2, val.trim());
      delete it.ownBook;
      edt=null; await saveCfg(); render();
      toast(val.trim()? d2.slice(5).replace('-','/')+'부터 '+val.trim() : '교재 지웠어요'); return;
    }
    if(t==='kind'){
      const v=val, text=((document.querySelector('#ev2')||{}).value||'').trim();
      const scope=(document.querySelector('#ev3')||{}).value||'hold';
      if(scope==='all'){
        applyChoice(it,v,sel,text); it.sure=true;
        if(it.once){ it.wd=parse(it.once).getDay(); it.from=it.once; delete it.once }
      }else if(scope==='hold'&&!it.once){
        const cp={id:'k'+Date.now(),cls:it.cls,once:sel,n:it.n,sure:true,off:false};
        applyChoice(cp,v,sel,text);
        cfg.items.push(cp);
        it.skip=(it.skip||[]).concat([sel]);
      }else if(it.once){
        applyChoice(it,v,sel,text); it.sure=true;
      }else{
        const cp={id:'k'+Date.now(),cls:it.cls,once:sel,n:it.n,sure:true,off:false};
        applyChoice(cp,v,sel,text);
        cfg.items.push(cp);
        it.hide=(it.hide||[]).concat([sel]);
      }
      edt=null; await saveCfg(); render(); toast('바꿨어요'); return;
    }
    if(t==='del'){
      if(it.once){
        if(!/^[umkr]/.test(it.id||''))cfg.removedKeys=(cfg.removedKeys||[]).concat([skeyOf(it)]);
        cfg.items=cfg.items.filter(x=>x.id!==it.id);
      }else{
        it.until=sel;                       // 오늘부터 없음, 지난 기록은 유지
      }
      edt=null; await saveCfg(); render(); toast(it.once?'지웠어요':'오늘부터 없앴어요'); return;
    }
    if(t==='off'||t==='move'){
      const how = t==='move' ? 'date' : (val||'next');
      if(how==='next'){ it.skip=(it.skip||[]).concat([sel]); }
      else if(how==='none'){ it.hide=(it.hide||[]).concat([sel]); }
      else{
        const when=(document.querySelector(t==='move'?'#ev':'#ev2')||{}).value;
        if(!when){toast('날짜를 골라주세요');return}
        if(when===sel){toast('같은 날이에요');return}
        let newId=it.id;
        if(it.once){ it.once=when; }
        else{
          const rr=resolve(it,sel,true);
          const cp=Object.assign({},it);
          delete cp.wd; delete cp.from; delete cp.skip; delete cp.hide; delete cp.did;
          cp.id=newId='m'+Date.now(); cp.once=when;
          if(rr&&rr.num!=null){ cp.base=rr.num; cp.anchor=when }
          cfg.items.push(cp);
          if(isHol(sel)) it.did=(it.did||[]).concat([sel]);
          else it.hide=(it.hide||[]).concat([sel]);
        }
        const from=logs[mo], e2=from&&from[sel]&&from[sel][it.id];
        if(e2){
          await loadLog(when.slice(0,7));
          const m2=when.slice(0,7);
          logs[m2][when]=logs[m2][when]||{};
          logs[m2][when][newId]=e2;
          delete from[sel][it.id];
          await saveLog(m2);
        }
        edt=null; await saveCfg(); await go(when);
        toast(when.slice(5).replace('-','/')+'로 옮겼어요'); return;
      }
      edt=null; await saveCfg(); render();
      toast(how==='next'?'다음 번으로 미뤘어요':'그냥 넘겼어요'); return;
    }

    const c=b.dataset.rosadd, el=document.querySelector('#rosin');
    const tel=document.querySelector('#rostch');
    if(tel){
      cfg.teachers=cfg.teachers||{};
      if(tel.value.trim())cfg.teachers[c]=tel.value.trim(); else delete cfg.teachers[c];
    }
    const raw=(el?el.value:'')||'';
    const add=raw.split(/[,·\/\n]/).map(x=>x.trim()).filter(Boolean);
    if(!add.length){ await saveCfg(); render(); toast('저장했어요'); return }
    const cur=(roster(c)||[]).slice();
    add.forEach(nm=>{ if(cur.indexOf(nm)<0)cur.push(nm) });
    setRoster(c,cur);
    await saveCfg(); render(); toast(add.length+'명 넣었어요');
  });
  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.edit, was=!!editing[id];
    editing={}; if(!was)editing[id]=true;       // 한 번 더 누르면 닫힘
    armed=null; render();
  });
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{editing={};render()});
  document.querySelectorAll('[data-addday]').forEach(b=>b.onclick=async()=>{
    const id='u'+Date.now();
    const c0=allClasses()[0]||'새 반';
    cfg.items.push({id,cls:c0,kind:'vocab',wd:+b.dataset.addday,n:headcount(c0),sure:true,off:false});
    editing={}; editing[id]=true; await saveCfg(); render();
  });
  const add=document.querySelector('[data-add]');
  if(add)add.onclick=async()=>{
    const id='u'+Date.now();
    const c1=allClasses()[0]||'새 반';
    cfg.items.push({id,cls:c1,kind:'vocab',wd:1,n:headcount(c1),sure:true,off:false});
    editing={}; editing[id]=true; await saveCfg(); render();
  };
  const fr=document.querySelector('[data-fresh]');
  if(fr)fr.onclick=async()=>{
    try{
      if('serviceWorker' in navigator){
        const rs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(r=>r.unregister()));
      }
      if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))) }
    }catch(e){}
    location.reload(true);
  };
  const ex=document.querySelector('[data-export]');
  if(ex)ex.onclick=()=>{const s=JSON.stringify(cfg);
    navigator.clipboard?navigator.clipboard.writeText(s).then(()=>toast('복사했어요'),()=>prompt('복사해 두세요',s)):prompt('복사해 두세요',s)};
  const rs=document.querySelector('[data-reset]');
  if(rs)rs.onclick=async()=>{
    if(armed!=='reset'){armed='reset';render();return}
    armed=null; cfg=seed(); await saveCfg(); render();
  };
}

let pendImg=null;
let edt=null;   // {id,type} — 줄 안에서 바로 고치는 칸
let armed=null; // 한 번 더 눌러 확인
$('#imgin').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!f||!pendImg)return;
  const id=pendImg; pendImg=null;
  toast('사진 올리는 중…');
  try{
    const v=await upImg(await shrink(f));
    if(id==='__add'){ afImgs=afImgs.concat([v]); render(); toast('답지 넣었어요'); return }
    const en=entry(sel,id); en.imgs=(en.imgs||[]).concat([v]);
    await saveLog(sel.slice(0,7)); render(); toast('답지 넣었어요');
  }catch(err){ toast('사진 실패 — '+(err&&err.message?err.message:'')) }
};
$('#lb').onclick=()=>$('#lb').classList.remove('on');


let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1500)}

async function go(d){
  sel=d; open={}; addOpen=false; rtOpen=null; edt=null; armed=null;
  const mo=sel.slice(0,7);
  await loadLog(mo); await loadLog(prevMonth(mo));
  render();
}
$('#prev').onclick=()=>go(shift(sel,-1));
$('#next').onclick=()=>go(shift(sel,1));
$('#btoday').onclick=()=>go(ymd(new Date()));
$('#btmr').onclick=()=>go(shift(ymd(new Date()),1));
$('#dpick').onchange=e=>{if(e.target.value)go(e.target.value)};
$('#bsync').onclick=async()=>{await load();await go(sel);toast(WORKER?'다른 선생님이 고친 것까지 불러왔어요':'새로 불러왔어요')};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{tab=t.dataset.t;render()});
/* ── 갤럭시 앱 설치 버튼 ── */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=$('#binst'); if(b)b.style.display='';
});
window.addEventListener('appinstalled', ()=>{
  deferredPrompt=null;
  const b=$('#binst'); if(b)b.style.display='none';
  toast('설치했어요');
});
$('#binst').onclick=async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice }catch(e){}
  deferredPrompt=null; $('#binst').style.display='none';
};

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ── 새 버전이 올라오면 알아서 받아오기 ── */
async function checkUpdate(){
  try{
    const r=await fetch('index.html?cb='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const txt=await r.text();
    const m=txt.match(/const APP_VER='([^']+)'/);
    if(!m || m[1]===APP_VER) return;
    let n=0;
    try{ n=Number(sessionStorage.getItem('upd')||0) }catch(e){}
    if(n>=2) return;                       // 혹시 모를 무한 새로고침 막기
    try{ sessionStorage.setItem('upd', String(n+1)) }catch(e){}
    toast('새 버전을 받아오는 중…');
    try{
      if('serviceWorker' in navigator){
        const rs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(rs.map(x=>x.unregister()));
      }
      if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))) }
    }catch(e){}
    setTimeout(()=>location.reload(), 400);
  }catch(e){}
}
setInterval(checkUpdate, 10*60*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)checkUpdate() });
window.addEventListener('focus', checkUpdate);

/* ── 자동 동기화 ── */
const busy=()=>addOpen||rtOpen||edt||armed||Object.keys(open).some(k=>open[k]);
async function poll(){
  if(!WORKER||memory||busy())return;
  if(document.hidden)return;
  try{
    const r=await fetch(WORKER+'/load?room='+encodeURIComponent(ROOM),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    if((j.rev||0)>rev && j.data){
      rev=j.rev;
      if(j.data.cfg&&j.data.cfg.v===SEEDV)cfg=j.data.cfg;
      if(j.data.logs)logs=j.data.logs;
      render();
      toast('다른 분이 고친 내용을 받아왔어요');
    }
  }catch(e){}
}
setInterval(poll, 15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)poll() });
window.addEventListener('focus',poll);

(async()=>{await load();await go(ymd(new Date()));checkUpdate()})();
</script>
</body>
</html>
